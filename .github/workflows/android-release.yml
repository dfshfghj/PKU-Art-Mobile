name: Android Release

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Git tag to upload APKs to, for example v1.0.0
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  build-android-release:
    runs-on: ubuntu-22.04
    env:
      CI: "true"
      CARGO_TERM_COLOR: always
      NDK_VERSION: 27.2.12479018
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve tag
        id: release_tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install JavaScript dependencies
        run: npm install --include=optional

      - name: Build Tauri mobile frontend assets
        run: npm run build:tauri-mobile

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;${NDK_VERSION}"

      - name: Install Tauri CLI
        shell: bash
        run: cargo install tauri-cli --version "^2.10.0" --locked

      - name: Initialize Android project
        run: cargo tauri android init --ci

      - name: Setup Android signing
        shell: bash
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
        run: |
          printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS" > src-tauri/gen/android/keystore.properties
          printf 'password=%s\n' "$ANDROID_KEY_PASSWORD" >> src-tauri/gen/android/keystore.properties
          echo "$ANDROID_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
          printf 'storeFile=%s\n' "$RUNNER_TEMP/upload-keystore.jks" >> src-tauri/gen/android/keystore.properties

      - name: Patch generated Android signing config
        run: node .github/scripts/patch-android-signing.mjs

      - name: Build signed Android APKs
        shell: bash
        env:
          NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.NDK_VERSION }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.NDK_VERSION }}
        run: cargo tauri android build --apk --split-per-abi --ci

      - name: Collect release assets
        id: collect_assets
        shell: bash
        run: |
          mkdir -p release/android
          shopt -s nullglob
          apk_count=0

          for apk in src-tauri/gen/android/app/build/outputs/apk/*/release/*.apk; do
            case "$apk" in
              *-unsigned.apk|*.apk.idsig) continue ;;
            esac
            cp "$apk" "release/android/$(basename "$apk")"
            apk_count=$((apk_count + 1))
          done

          if [ "$apk_count" -eq 0 ]; then
            echo "No signed APKs were found in src-tauri/gen/android/app/build/outputs/apk." >&2
            exit 1
          fi

          (
            cd release/android
            sha256sum *.apk > SHA256SUMS.txt
          )

          echo "artifact_dir=release/android" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-${{ steps.release_tag.outputs.tag }}
          path: ${{ steps.collect_assets.outputs.artifact_dir }}
          if-no-files-found: error

      - name: Upload assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          files: |
            ${{ steps.collect_assets.outputs.artifact_dir }}/*.apk
            ${{ steps.collect_assets.outputs.artifact_dir }}/SHA256SUMS.txt
