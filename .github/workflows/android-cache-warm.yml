name: Android Cache Warm

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-cache-warm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  warm-android-cache:
    runs-on: ubuntu-22.04
    env:
      CI: "true"
      CARGO_TERM_COLOR: always
      NDK_VERSION: 27.2.12479018
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install JavaScript dependencies
        shell: bash
        run: |
          rm -rf node_modules package-lock.json
          npm install --include=optional

      - name: Build Tauri mobile frontend assets
        run: npm run build:tauri-mobile

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;${NDK_VERSION}"

      - name: Initialize Android project
        run: npx --no-install tauri android init --ci

      - name: Generate Tauri app icons
        run: npx --no-install tauri icon app-icon.png

      - name: Build Android APK for cache warm
        shell: bash
        env:
          NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.NDK_VERSION }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.NDK_VERSION }}
        run: npx --no-install tauri android build --apk --target aarch64 --ci
